version: "3.8"

services:
  ai-service:
    build: ./ai-service
    # Points specifically to the .env inside the ai-service folder
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    networks:
      - chat-app-network

  backend:
    build: ./backend
    # Points to the .env in your root directory (Chat webapplication/.env)
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - ai-service
    networks:
      - chat-app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chat-app-network

networks:
  chat-app-network:
    driver: bridge
