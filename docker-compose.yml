version: "3.8"

services:
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    networks:
      - chat-app-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - AI_SERVICE_URL=http://ai-service:8000
    ports:
      - "5000:5000"
    depends_on:
      - ai-service
    networks:
      - chat-app-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chat-app-network
    restart: unless-stopped

networks:
  chat-app-network:
    driver: bridge
